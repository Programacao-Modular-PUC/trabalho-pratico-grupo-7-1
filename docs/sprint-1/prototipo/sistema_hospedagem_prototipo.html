
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --sand:#F5EFE6;--sand2:#EAE0D0;--teal:#0F6E56;--teal-light:#E1F5EE;--teal-mid:#1D9E75;
    --text:#2C2C2A;--muted:#888780;--white:#fff;--border:#D3D1C7;
    --coral:#D85A30;--amber:#BA7517;
  }
  body{font-family:'DM Sans',sans-serif;background:var(--sand);color:var(--text);font-size:14px}
  .layout{display:flex;min-height:100vh}
  .sidebar{width:220px;background:var(--teal);padding:0;display:flex;flex-direction:column;flex-shrink:0}
  .logo{padding:24px 20px 20px;border-bottom:1px solid rgba(255,255,255,0.15)}
  .logo-title{font-family:'DM Serif Display',serif;color:#fff;font-size:18px;line-height:1.2}
  .logo-sub{color:rgba(255,255,255,0.6);font-size:11px;margin-top:2px}
  .nav{padding:12px 0;flex:1}
  .nav-section{padding:8px 20px 4px;color:rgba(255,255,255,0.45);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;cursor:pointer;color:rgba(255,255,255,0.75);font-size:13px;transition:background .15s}
  .nav-item:hover{background:rgba(255,255,255,0.1)}
  .nav-item.active{background:rgba(255,255,255,0.18);color:#fff;font-weight:500}
  .nav-icon{width:16px;height:16px;opacity:.8;flex-shrink:0}
  .main{flex:1;overflow:auto}
  .topbar{background:var(--white);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between}
  .topbar-title{font-family:'DM Serif Display',serif;font-size:20px;color:var(--text)}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;font-weight:500;border:none;transition:all .15s}
  .btn-primary{background:var(--teal);color:#fff}
  .btn-primary:hover{background:var(--teal-mid)}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
  .btn-outline:hover{background:var(--sand)}
  .btn-danger{background:#FCEBEB;color:#A32D2D;border:1px solid #F7C1C1}
  .content{padding:24px 28px}
  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
  .stat-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px}
  .stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .stat-value{font-size:26px;font-weight:500;color:var(--text);margin-top:4px}
  .stat-tag{font-size:11px;color:var(--teal);margin-top:2px}
  .card{background:var(--white);border:1px solid var(--border);border-radius:12px;margin-bottom:16px}
  .card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .card-title{font-weight:500;font-size:14px}
  .table{width:100%;border-collapse:collapse}
  .table th{padding:10px 16px;text-align:left;font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border)}
  .table td{padding:12px 16px;border-bottom:1px solid var(--sand);font-size:13px}
  .table tr:last-child td{border-bottom:none}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500}
  .badge-green{background:#EAF3DE;color:#3B6D11}
  .badge-amber{background:#FAEEDA;color:#854F0B}
  .badge-red{background:#FCEBEB;color:#A32D2D}
  .badge-teal{background:var(--teal-light);color:var(--teal)}
  .badge-gray{background:#F1EFE8;color:#5F5E5A}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px}
  .form-group{display:flex;flex-direction:column;gap:6px}
  .form-group.full{grid-column:1/-1}
  label{font-size:12px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  input,select,textarea{padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--text);background:var(--white);width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal)}
  textarea{resize:vertical;min-height:70px}
  .form-footer{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
  .tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:11px}
  .dash-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
  .activity-item{display:flex;align-items:flex-start;gap:12px;padding:12px 20px;border-bottom:1px solid var(--sand)}
  .activity-item:last-child{border-bottom:none}
  .activity-dot{width:8px;height:8px;border-radius:50%;background:var(--teal-mid);margin-top:4px;flex-shrink:0}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--teal-light);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;color:var(--teal);flex-shrink:0}
  .recibo{background:var(--white);border:1px solid var(--border);border-radius:12px;max-width:480px;margin:0 auto}
  .recibo-header{background:var(--teal);padding:24px;border-radius:12px 12px 0 0;text-align:center}
  .recibo-body{padding:24px}
  .recibo-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--sand);font-size:13px}
  .recibo-total{display:flex;justify-content:space-between;padding:14px 0 0;font-size:15px;font-weight:500}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:12px;background:var(--teal-light);color:var(--teal)}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--sand)}
  .toggle-row:last-child{border-bottom:none}
  .toggle-switch{width:38px;height:20px;background:var(--border);border-radius:10px;position:relative;cursor:pointer}
  .toggle-switch.on{background:var(--teal-mid)}
  .toggle-knob{width:16px;height:16px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:left .15s}
  .toggle-switch.on .toggle-knob{left:20px}
  .empty-state{text-align:center;padding:40px;color:var(--muted)}
  .empty-icon{font-size:32px;margin-bottom:8px}
  .breadcrumb{font-size:12px;color:var(--muted);margin-bottom:6px}
  .room-card{background:var(--white);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .room-img{background:linear-gradient(135deg,var(--sand2),var(--teal-light));height:100px;display:flex;align-items:center;justify-content:center;font-size:32px}
  .room-body{padding:14px}
  .room-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
</style>

function show(screen) {
  document.getElementById('mainContent').innerHTML = screens[screen] || screens.dashboard;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const map = {dashboard:0,residencias:1,novaResidencia:1,quartos:2,novoQuarto:2,clientes:3,novoCliente:3,alugueis:4,novoAluguel:5,recibo:6};
  const items = document.querySelectorAll('.nav-item');
  if(items[map[screen]]) items[map[screen]].classList.add('active');
}
