# ============================================================
# Perfil DEV — H2 em memória (Sprint 4)
# Permite rodar a aplicação sem instalar/configurar o MySQL.
# Ative com:  --spring.profiles.active=dev
# ============================================================
spring.datasource.url=jdbc:h2:mem:hospedagem;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Console web do H2 em http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:mem:hospedagem  |  user: sa  |  sem senha)
spring.h2.console.enabled=true
